name: CI-CD Bautista

on:
  push:
    branches:
      - Bautista

env:
  IMAGE_NAME: ghcr.io/chrisShikayri/bautista
  IMAGE_TAG: 1.0.5
  FULL_IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📥 Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run tests
        run: pytest -q

      - name: 🔐 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: 🏗️ Build Docker image
        run: docker build -t $FULL_IMAGE .

      - name: 📤 Push image to GHCR
        run: docker push $FULL_IMAGE

      # -------------------------------
      #  SECCIÓN AÑADIDA DE TU OTRO WORKFLOW
      # -------------------------------

      - name: 🔍 Ver variables de seguridad
        run: |
          echo "Host: ${{ secrets.VPS_HOST }}"
          echo "Usuario: ${{ secrets.VPS_SSH_USER }}"
          echo "Puerto: 22"

      - name: 🔧 Probar conexión SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            hostname
            whoami
            uptime

      - name: 📤 Pasar archivo docker-stack.yml al servidor
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          source: "stack.yml"
          target: "/home/${{ secrets.VPS_SSH_USER }}/bautista_stack"

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: ${{ needs.ci.result == 'success' }}

    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Deploy application via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            cd ~/bautista_stack

            echo "==> Login a GHCR con PAT"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u chrisshikayri --password-stdin

            echo "==> Pull de la imagen"
            docker pull $FULL_IMAGE

            echo "==> Eliminando stack previo"
            docker stack rm bautista_stack || true
            sleep 25

            echo "==> Desplegando nuevo stack"
            docker stack deploy -c stack.yml --with-registry-auth bautista_stack

      - name: 🔍 Health Check remoto
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sleep 5
            curl -f http://localhost/ || (echo "App no responde" && exit 1)

  # OPCIONAL: DNS
  create_dns:
    needs: deploy
    runs-on: ubuntu-latest
    if: ${{ secrets.CF_API_TOKEN && secrets.CF_ZONE_ID }}

    steps:
      - name: 🌐 Ensure DNS record (Cloudflare)
        run: |
          IP=${{ secrets.VPS_HOST }}
          ZONE=${{ secrets.CF_ZONE_ID }}
          TOKEN=${{ secrets.CF_API_TOKEN }}
          NAME=bautista

          RECORD=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$NAME.byronrm.com" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json")

          EXISTS=$(echo "$RECORD" | jq -r '.result | length')

          if [ "$EXISTS" = "0" ]; then
            echo "Creando DNS $NAME.byronrm.com -> $IP"
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"$NAME\",\"content\":\"$IP\",\"ttl\":120,\"proxied\":false}" | jq .
          else
            echo "DNS ya existe"
          fi
